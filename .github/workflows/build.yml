name: Build directory

on:
  schedule:
    - cron: "17 9 * * *"   # every day ~3am Mountain
  workflow_dispatch: {}      # "Run workflow" button for an instant update
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download ZIP code locations (US Census)
        run: |
          for y in 2024 2023 2022; do
            if curl -fsSL -o zcta.zip "https://www2.census.gov/geo/docs/maps-data/data/gazetteer/${y}_Gazetteer/${y}_Gaz_zcta_national.zip"; then break; fi
          done
          unzip -o zcta.zip && mv *_Gaz_zcta_national.txt zcta.txt
      - name: Build site
        env:
          SHEET_CSV_URL: ${{ vars.SHEET_CSV_URL }}
          SITE_URL: ${{ vars.SITE_URL }}
          ZCTA_FILE: zcta.txt
        run: node build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
